[project]
name = "warden"
version = "0.3.0"
description = "Fleets of DigitalOcean machines on Tailscale, running module folders in Herdr, driven by Temporal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.35.0",
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "pulumi>=3.130.0",
    "pulumi-digitalocean>=4.30.0",
    "pulumi-tailscale>=0.29.0",
]

[project.urls]
Repository = "https://github.com/medmahmoudi26/warden"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
warden-serve = "warden.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM117", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["warden", "tests"]
